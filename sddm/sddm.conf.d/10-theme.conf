# SDDM login theme. Installed to /etc/sddm.conf.d/10-theme.conf by setup.sh.
# "minimal" is our own theme (sddm/themes/minimal/), copied to
# /usr/share/sddm/themes/minimal by setup.sh: username (prefilled) + password
# + Reboot/Power Off, Catppuccin Mocha, nothing else.
#
# HiDPI: the greeter runs on X11 before sway, so sway's output scale does not
# apply. Main.qml sizes the UI at 2x on retina-class panels (>=2400x1400) and
# 1x otherwise (Thinkpad 1080p, MBA 1366x768). Do not set QT_SCALE_FACTOR here
# — that would be wrong on the 1x machines.
[Theme]
Current=minimal
